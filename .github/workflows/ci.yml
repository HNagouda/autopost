name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh

  # main only takes merges from dev, so everything released has been through a dev build first.
  main-only-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request comes from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "Pull requests into main must come from dev, this one comes from ${{ github.head_ref }}."
          exit 1
