name: Release

# Every push to main, which in practice is a merge from dev, publishes the next version, like v1.0.3.
on:
  push:
    branches: [main]
    # A merge that only touches the launch video or the workflows ships the same app, so it
    # should not publish a new version. A merge that also changes the app still releases.
    paths-ignore:
      - "promo/**"
      - ".github/workflows/**"

permissions:
  contents: write

# Two merges in quick succession must not both claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, so next-version.sh can see which versions already exist.
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Pick version
        id: version
        run: echo "version=$(./scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Build app bundle
        run: VERSION="${{ steps.version.outputs.version }}" ./scripts/build-app.sh
      # ditto keeps the bundle's extended attributes and signature intact, which plain zip does not.
      - name: Zip app
        run: ditto -c -k --keepParent build/Autopost.app "Autopost-v${{ steps.version.outputs.version }}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" "Autopost-$TAG.zip" --target "$GITHUB_SHA" --title "Autopost $TAG" --generate-notes
