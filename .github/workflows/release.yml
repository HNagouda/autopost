name: Release

# Pushing a tag like v1.2 builds Autopost.app and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      # ditto keeps the bundle's extended attributes and signature intact, which plain zip does not.
      - name: Zip app
        run: ditto -c -k --keepParent build/Autopost.app "Autopost-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Autopost-${GITHUB_REF_NAME}.zip" --title "Autopost $GITHUB_REF_NAME" --generate-notes
