name: Feature idea
description: Something Autopost could do to make posting easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or post you have in mind, and where Autopost gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Sketches and screenshots of other apps are welcome.
